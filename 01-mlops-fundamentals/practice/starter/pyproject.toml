[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taxi-duration-course"
version = "0.1.0"
description = "Student starter for the local taxi-duration MLOps practical"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "pandas>=2.2,<4", "scikit-learn>=1.6,<2", "pyarrow>=18"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6"]

[project.scripts]
taxi-duration = "taxi_duration.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["src"]
